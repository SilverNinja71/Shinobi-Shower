name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: shinobi-bridge-1d/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd shinobi-bridge-1d
          npm ci
          npm run build

      - name: Prepare GitHub Pages Artifact Directory
        run: |
          mkdir -p _site
          # Copy game to root of GitHub Pages
          cp -r shinobi-bridge-1d/dist/* _site/
          # Also support direct subpath /shinobi-bridge-1d/
          mkdir -p _site/shinobi-bridge-1d
          cp -r shinobi-bridge-1d/dist/* _site/shinobi-bridge-1d/
          # Prevent Jekyll from ignoring files
          touch _site/.nojekyll

      # Deployment Path A: Deploy to gh-pages branch (works if Pages Source is set to "Deploy from a branch")
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      # Deployment Path B: Deploy via GitHub Actions artifact (works if Pages Source is set to "GitHub Actions")
      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
